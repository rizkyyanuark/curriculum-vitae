<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae - Rizky Yanuar Kristianto</title>
    
    <!-- Open Graph Metadata for Rich Link Previews on LinkedIn / WhatsApp / Telegram -->
    <meta property="og:title" content="Rizky Yanuar Kristianto - Curriculum Vitae" />
    <meta property="og:description" content="AI Data Engineer | State University of Surabaya | View and Download Latest Resume" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rizkyyanuark.github.io/curriculum-vitae/" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #f0f6fc;
        }
        .header-subtitle {
            font-size: 12px;
            color: #8b949e;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #238636;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #2ea043;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
        .viewer-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 55px);
            position: relative;
            background-color: #525659;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .fallback-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 24px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="header-title">Rizky Yanuar Kristianto</div>
            <div class="header-subtitle">AI Data Engineer - Curriculum Vitae</div>
        </div>
        <div class="actions">
            <a href="https://github.com/rizkyyanuark/curriculum-vitae" class="btn btn-secondary" target="_blank" rel="noopener">GitHub Repo</a>
            <a href="./cv.pdf" class="btn btn-primary" download="CV_Rizky_Yanuar_Kristianto_AI_Data_Engineer.pdf">Download PDF</a>
        </div>
    </header>

    <div class="viewer-container">
        <iframe src="./cv.pdf#toolbar=1&navpanes=0" type="application/pdf">
            <div class="fallback-message">
                <h2 style="color: #f0f6fc; margin-bottom: 8px;">Curriculum Vitae Preview</h2>
                <p style="margin: 12px 0 20px; font-size: 14px; color: #8b949e;">If the PDF does not display automatically in your browser, please click below:</p>
                <a href="./cv.pdf" class="btn btn-primary">Open CV in Fullscreen</a>
            </div>
        </iframe>
    </div>
</body>
</html>
