name: Build and Deploy CV
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    egv:
      FILE: cv
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Compile LaTeX to PDF
        uses: dante-ev/latex-action@latest
        with:
          root_file: cv
          working_directory: .
      - name: Prepare Artifacts
        run: |
          mkdir -p github_artifacts
          mv cv.pdf github_artifacts/
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@4
        with:
          name: cv-pdf
          path: github_artifacts/
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download PDF Artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: github_artifacts
      - name: Prepare Deployment Directory
        run: |
          mkdir -p github_deploy
          mv github_artifacts/cv.pdf github_deploy/
          cp index.html github_deploy/
          touch github_deploy/.nojekyll
      - name: Deploy to GitHub Pages (build branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: false
