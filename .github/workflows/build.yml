name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CV (XeLaTeX)
        uses: dante-ev/latex-action@latest
        with:
          root_file: cv
          compiler: xelatex
          working_directory: .

      - name: Prepare Artifact
        run: mkdir -p github_artifacts && mv cv.pdf ./github_artifacts/

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv.pdf
          path: ./github_artifacts

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cv.pdf
          path: github_artifacts

      - name: Prepare Deploy Directory
        run: |
          mkdir -p github_deploy
          find github_artifacts -name "cv.pdf" -exec cp {} github_deploy/ \;
          cp index.html github_deploy/
          if [ -f CNAME ]; then cp CNAME github_deploy/; fi
          touch github_deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: false

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cv.pdf
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cv.pdf
          generate_release_notes: true
